services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    image: url-shortner
    container_name: url-shortner
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=INFO
      - BASE_URL=http://localhost
    volumes:
      - ./backend/.logs:/app/backend/.logs
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: url-shortner-redis
    env_file:
      - ./backend/.env
    entrypoint: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_KEY\" --appendonly yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
