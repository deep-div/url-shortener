_format_version: "3.0"
_transform: true

# ─────────────────────────────────────────────────────────────────────────────
# Kong declarative (DB-less) config — reverse proxy + baseline security headers.
# No auth / rate-limiting yet. TLS is terminated by Render's edge proxy
# (deployment target) — Kong only handles plain HTTP internally, so no
# ssl/https_redirect config is needed here.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend — normal requests ───────────────────────────────────
  - name: backend-service
    url: http://127.0.0.1:8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: health-route
        paths: ["/health"]
        strip_path: false

      - name: api-route
        paths: ["/v1"]
        strip_path: false

      # Short-code redirects, e.g. /abc123 — single path segment only,
      # so it doesn't swallow multi-segment SPA routes like /dashboard/settings.
      - name: shortcode-route
        paths: ["~/[a-zA-Z0-9_-]+$"]
        strip_path: false
        regex_priority: 100

  # ── FastAPI backend — SSE live analytics stream ─────────────────────────
  # Separate service so it can get a much longer read_timeout without
  # affecting normal API calls.
  - name: backend-sse-service
    url: http://127.0.0.1:8000
    connect_timeout: 60000
    write_timeout: 3600000
    read_timeout: 3600000
    routes:
      - name: sse-route
        paths: ["/v1/analytics/live"]
        strip_path: false
        regex_priority: 200

  # ── Nginx static file server — built frontend (dist/) ───────────────────
  - name: frontend-service
    url: http://127.0.0.1:3000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      # Catch-all — anything not matched above (SPA routes, JS/CSS assets, etc.)
      - name: frontend-route
        paths: ["/"]
        strip_path: false

# ─────────────────────────────────────────────────────────────────────────────
# Security response headers for API traffic. The static frontend already
# gets these from nginx/default.conf — these apply the same baseline to
# JSON/SSE responses coming out of the FastAPI backend.
# ─────────────────────────────────────────────────────────────────────────────
plugins:
  - name: response-transformer
    service: backend-service
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: SAMEORIGIN"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

  # Caps request body size on the JSON API to guard against oversized
  # payloads (e.g. someone POSTing a multi-GB body to /v1). Scoped to the
  # route rather than the whole service so it doesn't affect health checks.
  - name: request-size-limiting
    route: api-route
    config:
      allowed_payload_size: 1
      size_unit: megabytes
      require_content_length: false

  # ── Rate limiting — 100 req/min per route, per client IP ─────────────────
  # "local" policy: counters kept in-memory per Kong node (no Redis/DB
  # dependency — fits the DB-less deployment). health-route is excluded
  # since it's just used for container/uptime checks.
  - name: rate-limiting
    route: api-route
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: rate-limiting
    route: shortcode-route
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: rate-limiting
    route: sse-route
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: response-transformer
    service: backend-sse-service
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: SAMEORIGIN"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
