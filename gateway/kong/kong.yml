_format_version: "3.0"
_transform: true

# ─────────────────────────────────────────────────────────────────────────────
# Kong declarative (DB-less) config — reverse proxy + baseline security headers.
# No auth / rate-limiting yet. TLS is terminated by Render's edge proxy
# (deployment target) — Kong only handles plain HTTP internally, so no
# ssl/https_redirect config is needed here.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend — normal requests ───────────────────────────────────
  - name: backend-service
    url: http://127.0.0.1:8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: health-route
        paths: ["/health"]
        strip_path: false

      - name: api-route
        paths: ["/v1"]
        strip_path: false

      # Internal ops/debug endpoint (Kafka consumer lag) — not part of the
      # public product surface, so it's locked down with key-auth below.
      # Needs a dedicated route (higher priority than api-route) so the
      # plugin can be scoped to just this path.
      - name: kafka-lag-route
        paths: ["/v1/kafka/lag"]
        strip_path: false
        regex_priority: 50

      # Short-code redirects, e.g. /abc123 — single path segment only,
      # so it doesn't swallow multi-segment SPA routes like /dashboard/settings.
      - name: shortcode-route
        paths: ["~/[a-zA-Z0-9_-]+$"]
        strip_path: false
        regex_priority: 100

  # ── FastAPI backend — SSE live analytics stream ─────────────────────────
  # Separate service so it can get a much longer read_timeout without
  # affecting normal API calls.
  - name: backend-sse-service
    url: http://127.0.0.1:8000
    connect_timeout: 60000
    write_timeout: 3600000
    read_timeout: 3600000
    routes:
      - name: sse-route
        paths: ["/v1/analytics/live"]
        strip_path: false
        regex_priority: 200

  # ── Nginx static file server — built frontend (dist/) ───────────────────
  - name: frontend-service
    url: http://127.0.0.1:3000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      # Catch-all — anything not matched above (SPA routes, JS/CSS assets, etc.)
      - name: frontend-route
        paths: ["/"]
        strip_path: false

# ─────────────────────────────────────────────────────────────────────────────
# Security response headers for API traffic. The static frontend already
# gets these from nginx/default.conf — these apply the same baseline to
# JSON/SSE responses coming out of the FastAPI backend.
# ─────────────────────────────────────────────────────────────────────────────
plugins:
  - name: response-transformer
    service: backend-service
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: SAMEORIGIN"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

  # Caps request body size on the JSON API to guard against oversized
  # payloads (e.g. someone POSTing a multi-GB body to /v1). Scoped to the
  # route rather than the whole service so it doesn't affect health checks.
  - name: request-size-limiting
    route: api-route
    config:
      allowed_payload_size: 1
      size_unit: megabytes
      require_content_length: false

  # "local" policy: counters kept in-memory per Kong node (no Redis/DB
  # dependency — fits the DB-less deployment). health-route is excluded
  # since it's just used for container/uptime checks.
  - name: rate-limiting
    route: api-route
    config:
      minute: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: rate-limiting
    route: shortcode-route
    config:
      minute: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: rate-limiting
    route: sse-route
    config:
      minute: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: response-transformer
    service: backend-sse-service
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: SAMEORIGIN"
          - "Referrer-Policy: strict-origin-when-cross-origin"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

  # ── Lock down the internal Kafka-lag debug endpoint ───────────────────────
  # Only whoever holds the API key (you) can call this — never embedded in
  # any frontend/client code, so it stays a real secret. Pass it as:
  #   curl -H "apikey: <key>" https://<host>/v1/kafka/lag
  - name: key-auth
    route: kafka-lag-route
    config:
      key_names: ["apikey"]
      hide_credentials: true

  # Extra-strict limit on this internal debug endpoint — it's only ever
  # called manually by you, never by real product traffic.
  - name: rate-limiting
    route: kafka-lag-route
    config:
      minute: 10
      policy: local
      fault_tolerant: true
      hide_client_headers: false

consumers:
  - username: ops-admin
    keyauth_credentials:
      - key: "9f1c7e4b8d3a2c6f5e1a9b7c4d8f2e6a1c3b5d7e9f0a2b4c6d8e1f3a5b7c9d2e4f6a8c1b3d5e7f9a0c2e4d6f8b1a3c5e7d9f0a2b4c6d8e1f3a5b7c9d2e4f6"
