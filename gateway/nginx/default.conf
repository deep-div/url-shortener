# It is used only to serve static frontend (dist/) files — requests
# come from Kong (127.0.0.1:3000), never directly from the client.
server {
    listen 127.0.0.1:3000;

    server_tokens off;

    root /app/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Frontend — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
